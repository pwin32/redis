# Redis Sentinel configuration for the portable Windows package.
#
# This example is intentionally loopback-only. Before monitoring remote Redis
# servers, review bind/protected-mode, authentication, announce addresses, and
# firewall rules. Sentinel rewrites this file, so run it from a writable copy.

bind 127.0.0.1
protected-mode yes
port 26379

# Redis for Windows runs Sentinel in the foreground rather than as a POSIX
# daemon. An empty logfile writes to the launching console.
daemonize no
loglevel notice
logfile ""
dir ./

# Replace this example master, address, port, and quorum for your deployment.
sentinel monitor mymaster 127.0.0.1 6379 2
sentinel down-after-milliseconds mymaster 30000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 180000

# Add sentinel auth-user/auth-pass directives when the monitored Redis
# deployment requires authentication. Leave script hooks disabled unless their
# programs and Windows permissions have been reviewed explicitly.
