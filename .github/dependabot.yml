version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      non-major-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /.codespell
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      non-major-python-tools:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
