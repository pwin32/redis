name: Public Windows validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      performance_analysis:
        description: Run controlled Windows A/B benchmarks and gprof
        type: boolean
        default: false
      baseline_sha:
        description: Exact baseline commit for performance analysis
        type: string
      candidate_sha:
        description: Exact candidate commit (defaults to this workflow commit)
        type: string
      reference_sha:
        description: Optional original TLS-enabled commit for a before/after comparison
        type: string

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.performance_analysis && 'performance' || 'validation' }}
  cancel-in-progress: true

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run public-source hygiene checks
        run: ./scripts/check-public-hygiene.sh --history
      - name: Validate packaged process-instance semantics
        run: bash tests/windows/package-process-identity-test.sh

  mingw-smoke:
    if: ${{ !inputs.performance_analysis }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve repository bytes for MSYS2 Git
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Git reset failed while restoring the exact source checkout.'
          }
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
            throw 'Git status failed while checking the restored checkout.'
          }
          if ($dirty.Count -ne 0) {
            $dirty | Write-Error
            throw 'The exact source checkout is not clean after byte restoration.'
          }
      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-gcc
            curl
            tar
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-zstd

      - name: Normalize source bytes for MSYS2 Git
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          dirty="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty" >&2
            echo 'The MSYS2 Git checkout is not clean after byte normalization.' >&2
            exit 1
          fi
      - name: Build MinGW64 core and interop targets
        run: |
          ./build-mingw.sh -j2
          make -f Makefile.mingw interop-test
      - name: Check executable hardening
        run: bash tests/windows/pe-hardening.sh build/mingw64
      - name: Run focused Redis tests
        run: >-
          ./runtest-mingw.sh --clients 1 --quiet --timeout 300
          --single unit/type/string --single unit/printver --single windows/config
          --single windows/cpuaffinity
      - name: Run Windows CPU affinity tests
        run: ./build/mingw64/redis-affinity-test.exe
      - name: Run Windows interop test
        run: |
          ./build/mingw64/interop-test.exe --legacy
          ./build/mingw64/interop-test.exe --modern

      - name: Build and check explicit no-TLS mode
        run: |
          make -f Makefile.mingw -j2 all interop-test BUILD_TLS=no
          bash tests/windows/tls-disabled.sh
          ./runtest-mingw.sh --clients 1 --quiet --timeout 300 --single unit/type/string
      - name: Restore default TLS mode and run focused TLS roles
        run: |
          make -f Makefile.mingw -j2 all interop-test
          ./build/mingw64/interop-test.exe --legacy
          ./build/mingw64/interop-test.exe --modern
          ./runtest-mingw.sh --tls --clients 1 --quiet --timeout 600 --single unit/tls --single windows/tls --single unit/cluster/cluster-response-tls --single unit/cluster/tls-peer-impersonation
          ./runtest-mingw.sh --sentinel --tls --single 00-base
      - name: Check TLS slot migration buffer limits and cancellation
        run: |
          ./runtest-mingw.sh --tls --clients 1 --quiet --timeout 180 --dump-logs \
            --single unit/cluster/atomic-slot-migration \
            --only "Client output buffer limit is reached on source side" \
            --only "Full sync buffer limit is reached on destination side" \
            --only "RM_ResetDataset and RM_RdbLoad will cancel slot migration task"

      - name: Check TLS persistence and tool regression fixtures
        run: |
          ./runtest-mingw.sh --tls --clients 1 --quiet --timeout 300 --dump-logs \
            --single integration/aof-race --single integration/psync2-reg \
            --single integration/redis-benchmark --single integration/redis-cli

      - name: Check TLS replication disconnects and final replies
        run: |
          ./runtest-mingw.sh --tls --clients 1 --quiet --timeout 300 --dump-logs \
            --single integration/replication --single integration/replication-rdbchannel \
            --only "Set instance A as slave of B" \
            --only "BLPOP followed by role change*" \
            --only "Test main channel connection drops while loading rdb*"

  performance-analysis:
    if: ${{ inputs.performance_analysis }}
    needs: public-hygiene
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      REFERENCE_SHA: ${{ inputs.reference_sha }}
    steps:
      - name: Check out benchmark harness and source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source byte restoration failed.' }
      - name: Set up one MinGW64 toolchain for all variants
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make diffutils jq
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-python
      - name: Build comparable release and gprof variants
        run: bash tests/windows/performance-build.sh
      - name: Measure alternating A/B runs with a common client
        run: python tests/windows/performance-ab.py --manifest build/performance/manifest.json --stage benchmark
      - name: Profile the server variants separately with gprof
        run: python tests/windows/performance-ab.py --manifest build/performance/manifest.json --stage profile
      - name: Upload performance measurements and profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-performance-${{ github.sha }}
          path: |
            build/performance/*.json
            build/performance/*.txt
            build/performance/*.log
            build/performance/results
          if-no-files-found: error
          retention-days: 14
