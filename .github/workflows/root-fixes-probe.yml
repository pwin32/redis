name: Focused Windows root-fix probe

on:
  push:
    branches:
      - ci/probe-8.10-root-fixes
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to package and probe
        required: true
        type: string
      package_revision:
        description: Windows package revision to record
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: root-fixes-probe-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    name: Windows MinGW64 root-fix probe
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      WINDOWS_PACKAGE_REVISION: ${{ inputs.package_revision || '1' }}

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve repository bytes for MSYS2 Git
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Git reset failed while restoring the exact source checkout.'
          }
          $dirty = @(git status --porcelain --untracked-files=normal)
          if ($LASTEXITCODE -ne 0) {
            throw 'Git status failed while checking the restored checkout.'
          }
          if ($dirty.Count -ne 0) {
            $dirty | Write-Error
            throw 'The exact source checkout is not clean after byte restoration.'
          }

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            unzip
            zip
            jq
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tcl
            mingw-w64-x86_64-zstd

      - name: Normalize source bytes for MSYS2 Git
        run: |
          set -euo pipefail
          git config --local core.autocrlf false
          git config --local core.eol lf
          git config --local core.filemode false
          git reset --hard HEAD
          dirty="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$dirty" ]]; then
            printf '%s\n' "$dirty" >&2
            echo 'The MSYS2 Git checkout is not clean after byte normalization.' >&2
            exit 1
          fi

      - name: Resolve package version
        id: meta
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define REDIS_VERSION "\([^\"]*\)"/\1/p' src/version.h)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Parse Windows qualification scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
              'tests/windows/package-replication.ps1',
              'tests/windows/service.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "PowerShell syntax validation failed for $script."
            }
          }

      - name: Build and stage the single CI-only release candidate
        env:
          CI: 'true'
          PUBLIC_RELEASE_CI: '1'
          WINDOWS_PACKAGE_SOURCE_COMMIT: ${{ inputs.source_sha || github.sha }}
        run: |
          set -o pipefail
          mkdir -p build/qualification
          JOBS=2 ./package-mingw.sh 2>&1 | tee build/qualification/package-build.log

      - name: Audit package and set packaged test paths
        id: package
        run: |
          set -euo pipefail
          archive="$(find build/mingw64/releases -maxdepth 1 -type f -name '*.zip' -print -quit)"
          [[ -n "$archive" ]]
          mkdir -p build/qualification/package-audit
          ./tests/windows/package-audit.sh \
            "$archive" build/qualification/package-audit \
            "${{ steps.meta.outputs.version }}" "$WINDOWS_PACKAGE_REVISION" \
            2>&1 | tee build/qualification/package-audit.log
          package_dir="build/qualification/package-audit/package"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'package_dir=%s\n' "$package_dir" >> "$GITHUB_OUTPUT"
          printf 'REDIS_TEST_BINARY_DIR=%s\n' "$package_dir" >> "$GITHUB_ENV"
          printf 'REDIS_TEST_LAUNCHER=%s\n' "$(pwd -P)/build/mingw64/redis-test-launcher.exe" >> "$GITHUB_ENV"
          printf 'REDIS_TEST_MODULE_DIR=%s\n' "$(pwd -P)/build/mingw64/tests/modules" >> "$GITHUB_ENV"

      - name: Verify release bytes before focused suites
        run: |
          set -euo pipefail
          ./tests/windows/package-binary-identity.sh \
            build/mingw64 \
            build/qualification/package-audit/package \
            build/qualification/package-binary-identity.before.tsv

      - name: Run the affected root units against packaged binaries
        run: |
          set +e
          ./runtest-mingw.sh --clients 1 --verbose --dont-clean --timeout 600 \
            --single unit/type/string \
            --single integration/replication-rdbchannel \
            2>&1 | tee build/qualification/root-fixes.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            excerpt="$(grep -n -A80 -B30 -E '\*\*\* \[err\]|FAIL|error:|assertion:' build/qualification/root-fixes.log | tail -n 240)"
            if [[ -z "$excerpt" ]]; then
              excerpt="$(tail -n 240 build/qualification/root-fixes.log)"
            fi
            excerpt="${excerpt//'%'/'%25'}"
            excerpt="${excerpt//$'\r'/'%0D'}"
            excerpt="${excerpt//$'\n'/'%0A'}"
            printf '::error title=Focused Windows root-fix failure::%s\n' "$excerpt"
          fi
          exit "$status"

      - name: Reverify candidate identity and checksum
        if: always()
        run: |
          set -euo pipefail
          ./tests/windows/package-binary-identity.sh \
            build/mingw64 \
            build/qualification/package-audit/package \
            build/qualification/package-binary-identity.after.tsv
          cmp -s \
            build/qualification/package-binary-identity.before.tsv \
            build/qualification/package-binary-identity.after.tsv
          archive='${{ steps.package.outputs.archive }}'
          (
            cd "$(dirname "$archive")"
            sha256sum -c "$(basename "$archive").sha256"
          ) | tee build/qualification/package-checksum-after-tests.txt

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-root-fixes-probe-${{ inputs.source_sha || github.sha }}
          path: |
            build/qualification
            build/mingw64/package-soak-*
          if-no-files-found: warn
          retention-days: 14
