name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Canonical branch to publish (7.4 is intentionally excluded)
        required: true
        type: choice
        options:
          - mingw-8.10
          - mingw-8.8
          - mingw-7.2
          - mingw-6.2
      source_sha:
        description: Exact 40-character tip SHA to qualify and release
        required: true
        type: string
      windows_revision:
        description: Positive Windows package revision (new upstream release starts at 1)
        required: true
        default: '1'
        type: string
      confirm_tag:
        description: Type the exact expected vX.Y.Z-windows.N tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-windows-release-${{ inputs.source_branch }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release policy and maintained-line barrier
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.policy.outputs.source_branch }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      version: ${{ steps.policy.outputs.version }}
      revision: ${{ steps.policy.outputs.revision }}
      tag: ${{ steps.policy.outputs.tag }}
      gate_json: ${{ steps.policy.outputs.gate_json }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check exact source, version, tag, and all maintained-line tips
        id: policy
        shell: bash
        env:
          INPUT_SOURCE_BRANCH: ${{ inputs.source_branch }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_WINDOWS_REVISION: ${{ inputs.windows_revision }}
          INPUT_CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          branch="$INPUT_SOURCE_BRANCH"
          source_sha="$INPUT_SOURCE_SHA"
          revision="$INPUT_WINDOWS_REVISION"
          confirm_tag="$INPUT_CONFIRM_TAG"
          case "$branch" in
            mingw-8.10) expected_version=8.10.1 ;;
            mingw-8.8) expected_version=8.8.2 ;;
            mingw-7.2) expected_version=7.2.16 ;;
            mingw-6.2) expected_version=6.2.24 ;;
            *) echo '7.4 and non-canonical branches are not release eligible' >&2; exit 1 ;;
          esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exactly 40 lowercase hex characters' >&2; exit 1; }
          [[ "$revision" =~ ^[1-9][0-9]*$ ]] || { echo 'windows_revision must be a positive integer' >&2; exit 1; }
          branch_tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          [[ "$branch_tip" == "$source_sha" ]] || { echo "source_sha is not current tip of $branch" >&2; exit 1; }
          version="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/src/version.h?ref=${source_sha}" --jq '.content' | tr -d '\n' | base64 -d | sed -n 's/^#define REDIS_VERSION "\([^"]*\)"/\1/p')"
          [[ "$version" == "$expected_version" ]] || { echo "expected $expected_version at $source_sha, found $version" >&2; exit 1; }
          tag="v${version}-windows.${revision}"
          [[ "$confirm_tag" == "$tag" ]] || { echo "confirm_tag must equal $tag" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to requalify it" >&2
            exit 1
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/tmp/preflight-tag.json 2>/dev/null; then
            tag_target="$(jq -r '.object.sha' /tmp/preflight-tag.json)"
            [[ "$tag_target" == "$source_sha" ]] || {
              echo "existing tag $tag points to $tag_target, not $source_sha" >&2
              exit 1
            }
          fi

          lines=(mingw-8.10 mingw-8.8 mingw-7.4 mingw-7.2 mingw-6.2)
          gate='[]'
          for line in "${lines[@]}"; do
            tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${line}" --jq '.object.sha')"
            runs="$(gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/workflows/full-validation.yml/runs?branch=${line}&event=push&per_page=100")"
            qualified="$(jq -r --arg tip "$tip" '[.[].workflow_runs[]? | select(.head_sha == $tip and .conclusion == "success")] | sort_by(.run_number) | last // empty | [.id, .head_sha] | @tsv' <<<"$runs")"
            [[ -n "$qualified" ]] || { echo "no successful Full Windows qualification for current tip $line ($tip)" >&2; exit 1; }
            run_id="${qualified%%$'\t'*}"
            record="$(jq -cn --arg branch "$line" --arg sha "$tip" --arg run "$run_id" '{branch:$branch,source_sha:$sha,run_id:($run|tonumber),workflow:"Full Windows qualification"}')"
            gate="$(jq -c --argjson record "$record" '. + [$record]' <<<"$gate")"
          done
          printf 'source_branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'gate_json=%s\n' "$(jq -c --arg policy 'all five maintained-line tips passed Full Windows qualification' '{policy:$policy,lines:.}' <<<"$gate")" >> "$GITHUB_OUTPUT"

  qualify:
    name: Requalify exact release source on Windows
    needs: preflight
    uses: ./.github/workflows/full-validation.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      source_branch: ${{ needs.preflight.outputs.source_branch }}
      package_revision: ${{ needs.preflight.outputs.revision }}
      qualification_gate: ${{ needs.preflight.outputs.gate_json }}

  attest:
    name: Attest release package and SBOM
    needs: [preflight, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download qualified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: release-assets
      - name: Create SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.zip
      - name: Create SPDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.zip
          sbom-path: release-assets/sbom.spdx.json

  publish:
    name: Create immutable GitHub release
    needs: [preflight, qualify, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download qualified and attested release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: release-assets
      - name: Verify assets and publish without moving an existing tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          source_sha="$RELEASE_SOURCE_SHA"
          version="$RELEASE_VERSION"
          mapfile -d '' -t archives < <(find release-assets -maxdepth 1 -type f -name '*.zip' -print0)
          (( ${#archives[@]} == 1 )) || { echo 'expected exactly one release ZIP' >&2; exit 1; }
          archive="${archives[0]}"
          required_assets=(
            BUILDINFO.txt
            SHA256SUMS.txt
            TEST-REPORT.md
            benchmark.csv
            package-manifest.txt
            package-binary-identity.tsv
            release-evidence.json
            sbom.spdx.json
            toolchain.txt
          )
          for asset in "${required_assets[@]}"; do
            [[ -s "release-assets/$asset" ]] || { echo "missing or empty release asset: $asset" >&2; exit 1; }
          done
          [[ -s "$archive" ]] || { echo 'release ZIP is empty' >&2; exit 1; }
          expected_assets=("$archive")
          for asset in "${required_assets[@]}"; do
            expected_assets+=("release-assets/$asset")
          done
          mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if ! diff -u \
              <(printf '%s\n' "${expected_assets[@]}" | sort) \
              <(printf '%s\n' "${assets[@]}" | sort); then
            echo 'release-assets contains missing or unexpected files' >&2
            exit 1
          fi
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          jq -e --arg tag "$tag" --arg sha "$source_sha" '.release.tag == $tag and .source.commit == $sha and .qualification.release_binary_identity == "passed"' release-assets/release-evidence.json >/dev/null
          jq -e '.spdxVersion == "SPDX-2.3" and .SPDXID == "SPDXRef-DOCUMENT"' release-assets/sbom.spdx.json >/dev/null
          command -v unzip >/dev/null 2>&1 || { echo 'unzip is required to verify release binary identity' >&2; exit 1; }
          identity_header=$'build_file\tpackage_file\tsha256\tsize'
          [[ "$(sed -n '1p' release-assets/package-binary-identity.tsv)" == "$identity_header" ]] || {
            echo 'invalid package binary identity header' >&2
            exit 1
          }
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$archive" -d "$verify_dir"
          expected_identity_pairs=(
            $'redis-server.exe\tredis-server.exe'
            $'redis-server.exe\tredis-sentinel.exe'
            $'redis-check-aof.exe\tredis-check-aof.exe'
            $'redis-check-rdb.exe\tredis-check-rdb.exe'
            $'redis-cli.exe\tredis-cli.exe'
            $'redis-benchmark.exe\tredis-benchmark.exe'
            $'EventLog.dll\tEventLog.dll'
          )
          actual_identity_pairs=()
          identity_count=0
          while IFS=$'\t' read -r build_name package_name file_sha file_size; do
            [[ -n "$build_name" && -n "$package_name" ]] || { echo 'invalid empty identity record' >&2; exit 1; }
            [[ "$build_name" != */* && "$build_name" != *'\\'* && "$build_name" != .* ]] || {
              echo "unsafe build identity path: $build_name" >&2
              exit 1
            }
            [[ "$package_name" != */* && "$package_name" != *'\\'* && "$package_name" != .* ]] || {
              echo "unsafe package identity path: $package_name" >&2
              exit 1
            }
            [[ "$file_sha" =~ ^[0-9a-f]{64}$ && "$file_size" =~ ^[0-9]+$ ]] || {
              echo "invalid package identity digest or size for $package_name" >&2
              exit 1
            }
            packaged_file="$verify_dir/$package_name"
            [[ -f "$packaged_file" ]] || { echo "identity file is absent from ZIP: $package_name" >&2; exit 1; }
            actual_sha="$(sha256sum "$packaged_file" | sed 's/[[:space:]].*$//')"
            actual_size="$(wc -c < "$packaged_file" | tr -d '[:space:]')"
            [[ "$actual_sha" == "$file_sha" && "$actual_size" == "$file_size" ]] || {
              echo "release ZIP does not match binary identity record: $package_name" >&2
              exit 1
            }
            actual_identity_pairs+=("$build_name"$'\t'"$package_name")
            identity_count=$((identity_count + 1))
          done < <(sed '1d' release-assets/package-binary-identity.tsv)
          (( identity_count == 7 )) || { echo "expected seven package identity records, found $identity_count" >&2; exit 1; }
          if ! diff -u \
              <(printf '%s\n' "${expected_identity_pairs[@]}") \
              <(printf '%s\n' "${actual_identity_pairs[@]}"); then
            echo 'package binary identity contains missing, duplicate, reordered, or unexpected mappings' >&2
            exit 1
          fi
          mapfile -t barrier_lines < <(
            jq -r '.qualification.maintained_lines.lines[] | [.branch, .source_sha, (.run_id | tostring)] | @tsv' \
              release-assets/release-evidence.json
          )
          (( ${#barrier_lines[@]} == 5 )) || { echo 'maintained-line barrier does not contain five lines' >&2; exit 1; }
          declare -A seen_lines=()
          for record in "${barrier_lines[@]}"; do
            IFS=$'\t' read -r line qualified_sha run_id <<< "$record"
            [[ "$qualified_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid qualified SHA for $line" >&2; exit 1; }
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "invalid qualification run ID for $line" >&2; exit 1; }
            case "$line" in
              mingw-8.10|mingw-8.8|mingw-7.4|mingw-7.2|mingw-6.2) ;;
              *) echo "unexpected maintained line in release evidence: $line" >&2; exit 1 ;;
            esac
            [[ -z "${seen_lines[$line]:-}" ]] || { echo "duplicate maintained line: $line" >&2; exit 1; }
            seen_lines[$line]=1
            current_tip="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${line}" --jq '.object.sha')"
            [[ "$current_tip" == "$qualified_sha" ]] || {
              echo "$line moved from qualified tip $qualified_sha to $current_tip; refusing to publish" >&2
              exit 1
            }
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '{head_sha,event,conclusion}' | \
              jq -e --arg sha "$qualified_sha" \
                '.head_sha == $sha and .event == "push" and .conclusion == "success"' >/dev/null || {
                  echo "recorded qualification run $run_id is no longer a successful push run for $line" >&2
                  exit 1
                }
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to modify an existing release" >&2
            exit 1
          fi
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/tmp/tag.json 2>/dev/null; then
            tag_target="$(jq -r '.object.sha' /tmp/tag.json)"
            [[ "$tag_target" == "$source_sha" ]] || { echo "existing tag $tag points to $tag_target, refusing to move it" >&2; exit 1; }
            gh release create "$tag" "${assets[@]}" --verify-tag \
              --title "Redis $version for Windows" \
              --notes-file release-assets/TEST-REPORT.md
          else
            gh release create "$tag" "${assets[@]}" --target "$source_sha" \
              --title "Redis $version for Windows" \
              --notes-file release-assets/TEST-REPORT.md
          fi
          final_target="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          [[ "$final_target" == "$source_sha" ]] || { echo "release tag target changed unexpectedly" >&2; exit 1; }
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq '[.draft, .prerelease, .immutable] | @tsv' > /tmp/release-state.tsv
          IFS=$'\t' read -r draft prerelease immutable < /tmp/release-state.tsv
          [[ "$draft" == false && "$prerelease" == false && "$immutable" == true ]] || {
            echo "release was not published as an immutable normal release (draft=$draft prerelease=$prerelease immutable=$immutable)" >&2
            exit 1
          }
          printf 'RELEASE_IMMUTABLE=%s\n' "$immutable"
          printf 'PUBLISHED_RELEASE_OK tag=%s source=%s\n' "$tag" "$source_sha"
